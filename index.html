<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <title>My AI Assistant</title>
    <meta name="description" content="A fast, friendly AI chat companion powered by Google Gemini." />
    <meta property="og:title" content="My AI Assistant" />
    <meta property="og:description" content="A fast, friendly AI chat companion powered by Google Gemini." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
    <div id="root"></div>

    <script>
    (function () {
      if (window.__MY_AI_DEBUG_INSTALLED__) return;
      window.__MY_AI_DEBUG_INSTALLED__ = true;

      var panel, content, toggle, entries = 0;

      function safeUrl(value) {
        try {
          var u = new URL(value, location.href);
          ['apikey','code','access_token','refresh_token'].forEach(function(k) {
            u.searchParams.delete(k);
          });
          return u.origin + u.pathname +
            (u.search ? '?[query parameters hidden]' : '');
        } catch (_) {
          return String(value || 'unknown').slice(0, 250);
        }
      }

      function safeText(value) {
        return String(value || '')
          .replace(/sb_publishable_[A-Za-z0-9_-]+/g, '[KEY HIDDEN]')
          .replace(/eyJ[A-Za-z0-9_.-]+/g, '[TOKEN HIDDEN]')
          .replace(/(apikey|access_token|refresh_token|code)=([^&\s]+)/gi, '$1=[HIDDEN]')
          .slice(0, 1200);
      }

      function createPanel() {
        if (panel) return;

        panel = document.createElement('section');
        panel.id = 'my-ai-floating-debug';
        panel.style.cssText =
          'position:fixed;top:env(safe-area-inset-top,8px);left:8px;right:8px;' +
          'z-index:2147483647;max-height:38vh;display:flex;flex-direction:column;' +
          'background:#101827;color:#e5e7eb;border:1px solid #64748b;' +
          'border-radius:12px;box-shadow:0 5px 25px #0009;' +
          'font:12px/1.4 monospace;overflow:hidden;pointer-events:auto';

        var header = document.createElement('div');
        header.style.cssText =
          'display:flex;align-items:center;justify-content:space-between;' +
          'gap:6px;padding:9px;background:#1e293b;flex-shrink:0';

        var title = document.createElement('strong');
        title.textContent = 'MY AI ASSISTANT · LIVE DEBUG';
        title.style.color = '#fbbf24';

        var controls = document.createElement('div');
        controls.style.cssText = 'display:flex;gap:5px';

        function makeButton(label, action) {
          var btn = document.createElement('button');
          btn.textContent = label;
          btn.style.cssText =
            'padding:6px 9px;border:0;border-radius:6px;' +
            'background:#475569;color:white;font-size:11px';
          btn.onclick = action;
          return btn;
        }

        toggle = makeButton('Minimize', function() {
          var hidden = content.style.display === 'none';
          content.style.display = hidden ? 'block' : 'none';
          toggle.textContent = hidden ? 'Minimize' : 'Expand';
        });

        var copy = makeButton('Copy', function() {
          var logs = content.innerText;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(logs).then(function() {
              copy.textContent = 'Copied';
              setTimeout(function() { copy.textContent = 'Copy'; }, 1500);
            }).catch(function() { copy.textContent = 'Failed'; });
          } else {
            copy.textContent = 'Unavailable';
          }
        });

        controls.appendChild(copy);
        controls.appendChild(toggle);
        header.appendChild(title);
        header.appendChild(controls);

        content = document.createElement('div');
        content.style.cssText =
          'padding:0 10px 8px;overflow:auto;overscroll-behavior:contain;' +
          'max-height:calc(38vh - 42px)';

        panel.appendChild(header);
        panel.appendChild(content);
        document.body.appendChild(panel);
      }

      function log(title, details) {
        createPanel();
        entries++;

        var entry = document.createElement('pre');
        entry.style.cssText =
          'white-space:pre-wrap;overflow-wrap:anywhere;margin:0;' +
          'padding:8px 0;border-top:1px solid #334155;color:#dbeafe';
        entry.textContent =
          '[' + new Date().toLocaleTimeString() + '] ' + title +
          '\n' + safeText(details);
        content.appendChild(entry);
        content.scrollTop = content.scrollHeight;
      }

      window.__MY_AI_DEBUG_LOG__ = log;

      window.addEventListener('error', function(event) {
        log('BROWSER ERROR',
          'Message: ' + (event.message || 'Unknown') +
          '\nFile: ' + safeUrl(event.filename || '') +
          '\nLine: ' + (event.lineno || 'unknown'));
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var r = event.reason;
        log('PROMISE ERROR',
          r && (r.stack || r.message) ? (r.stack || r.message) : String(r));
      });

      var originalFetch = window.fetch;

      window.fetch = async function(input, init) {
        var requestUrl = typeof input === 'string'
          ? input : (input && input.url);
        var isSupabase = requestUrl &&
          requestUrl.indexOf('.supabase.co/') !== -1;

        if (!isSupabase) {
          return originalFetch.apply(this, arguments);
        }

        var headers;
        try {
          headers = new Headers(
            init && init.headers
              ? init.headers
              : (input instanceof Request ? input.headers : undefined)
          );
        } catch (_) {
          headers = new Headers();
        }

        log('SUPABASE REQUEST',
          'URL: ' + safeUrl(requestUrl) +
          '\nMethod: ' + ((init && init.method) || (input && input.method) || 'GET') +
          '\napikey header present: ' + headers.has('apikey') +
          '\napikey header non-empty: ' + Boolean(headers.get('apikey')));

        try {
          var response = await originalFetch.apply(this, arguments);
          var bodyText = '';

          try {
            bodyText = await response.clone().text();
          } catch (_) {}

          var message = '';
          try {
            var parsed = JSON.parse(bodyText);
            message = parsed.message || parsed.error_description ||
              parsed.error || parsed.hint || '';
          } catch (_) {
            message = bodyText;
          }

          log('SUPABASE RESPONSE',
            'HTTP Status: ' + response.status +
            '\nOK: ' + response.ok +
            '\nError details: ' + (message ? safeText(message) : 'No error message'));

          return response;
        } catch (error) {
          log('SUPABASE NETWORK ERROR',
            'URL: ' + safeUrl(requestUrl) +
            '\nError: ' + (error.message || String(error)));
          throw error;
        }
      };

      log('DEBUG READY',
        'Floating debug panel active. The app remains visible underneath.');
    })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
