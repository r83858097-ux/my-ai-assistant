<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <title>My AI Assistant</title>
    <meta name="description" content="A fast, friendly AI chat companion powered by Google Gemini." />
    <meta property="og:title" content="My AI Assistant" />
    <meta property="og:description" content="A fast, friendly AI chat companion powered by Google Gemini." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500/30 selection:text-indigo-200">
    <div id="root"></div>
    
<script>
(function () {
  function showError(message) {
    let box = document.getElementById('browser-error-box');
    if (!box) {
      box = document.createElement('pre');
      box.id = 'browser-error-box';
      box.style.cssText = 'position:fixed;inset:0;z-index:999999;background:#090d16;color:#ff7777;padding:20px;white-space:pre-wrap;overflow:auto;font:14px monospace';
      document.body.appendChild(box);
    }
    box.textContent += message + '\\n\\n';
  }

  window.addEventListener('error', function (e) {
    showError('BROWSER ERROR: ' + (e.message || 'Resource loading failed') +
      '\\nFile: ' + (e.filename || 'unknown') +
      '\\nLine: ' + (e.lineno || 'unknown'));
  }, true);

  window.addEventListener('unhandledrejection', function (e) {
    showError('PROMISE ERROR: ' + (e.reason?.stack || e.reason || 'unknown'));
  });
})();
</script>

<script type="module" src="/src/main.tsx"></script>
  </body>
</html>
